[package]
name = "safflower"
version = "1.1.0"
edition = "2024"
authors = ["nscathic"]
license = "MIT"
description = "A localising tool with macros to statically allocate formattable text."
repository = "https://github.com/nscathic/safflower"
homepage = "https://nscathic.eu/projects/safflower.html"
readme = "readme.md"
keywords = ["localisation", "localization", "language", "formatting"]
categories = ["internationalization", "localization"]
exclude = ["src/bin", "test-data"]

[dependencies]
safflower-core  = "1.1.0"
safflower-macro = "1.1.0"
unicode-segmentation = "1.13.3"

[workspace]
members = ["safflower-core", "safflower-macro"]

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_duration_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dev-dependencies]
quote = "1.0.42"
